<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run It — Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/main.css" />
    <style>
        .game-detail-layout {
            max-width: 860px;
            margin: 0 auto;
            padding: 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: var(--text);
        }

        .game-hero {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .game-hero-body {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 32px;
            padding: 24px;
        }

        .game-info-section h1 {
            margin: 12px 0 8px;
        }

        .game-host {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .game-details-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .game-detail-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .game-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 12px;
        }

        .game-action-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            position: sticky;
            top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spots-display {
            text-align: center;
        }

        .spots-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
        }

        .spots-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .spots-bar {
            height: 6px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
        }

        .spots-bar-fill {
            height: 100%;
            background: var(--green);
            border-radius: 999px;
            transition: width 0.3s;
        }

        .spots-bar-fill.full {
            background: var(--red);
        }

        .players-section {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .players-section h2 {
            margin-bottom: 16px;
        }

        .players-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .player-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--blue);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
        }

        .player-avatar.host {
            background: #7c3aed;
        }

        .player-name {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-role-badge {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .loading-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .game-hero-body {
                grid-template-columns: 1fr;
            }

            .game-action-card {
                position: static;
            }

            .game-detail-layout {
                padding: 16px;
                padding-bottom: 80px;
            }
        }
    </style>
</head>

<body style="background: var(--bg);">

    <div class="game-detail-layout" x-data="gameDetail()">

        <a href="/pages/map.html" class="back-link">← Back to games</a>

        <div x-show="loading" class="loading-state">
            <p>Loading game...</p>
        </div>

        <div x-show="!loading && game">

            <div class="game-hero">
                <div class="game-hero-body">

                    <div class="game-info-section">
                        <span class="pill pill-blue">⚽ Soccer</span>
                        <h1 x-text="game.description || 'Pickup Game'"></h1>

                        <div class="game-host">
                            <div class="avatar" style="width:28px;height:28px;font-size:11px;"
                                x-text="getPlayerInitials(host)" aria-hidden="true"></div>
                            <span>Hosted by <strong x-text="host ? host.username : '...'"></strong></span>
                        </div>

                        <div class="game-details-list">
                            <div class="game-detail-row">
                                <span aria-hidden="true">📍</span>
                                <span x-text="game.display_location || game.location_name"></span>
                            </div>
                            <div class="game-detail-row">
                                <span aria-hidden="true">🕐</span>
                                <span x-text="formatDate(game.starts_at)"></span>
                            </div>
                            <div class="game-detail-row" x-show="game.skill_level && game.skill_level !== 'any'">
                                <span aria-hidden="true">⭐</span>
                                <span x-text="capitalize(game.skill_level)"></span>
                            </div>
                        </div>

                        <p class="game-description" x-show="game.description" x-text="game.description"></p>
                    </div>

                    <div class="game-action-card">
                        <div class="spots-display">
                            <div class="spots-number" x-text="game.player_count + '/' + game.max_players"></div>
                            <div class="spots-label">players joined</div>
                            <div class="spots-bar" role="progressbar" :aria-valuenow="game.player_count"
                                :aria-valuemax="game.max_players" aria-valuemin="0">
                                <div class="spots-bar-fill" :class="{ full: game.status === 'full' }"
                                    :style="'width:' + (game.player_count / game.max_players * 100) + '%'"></div>
                            </div>
                        </div>

                        <span class="pill" style="text-align:center;"
                            :class="game.status === 'full' ? 'pill-red' : 'pill-green'"
                            x-text="game.status === 'full' ? 'Game Full' : 'Open'"></span>

                        <button x-show="!isInGame && !isHost" class="btn btn-primary btn-full" :disabled="submitting"
                            @click="joinGame()"
                            x-text="submitting ? 'Joining...' : (game.status === 'full' ? 'Join Waitlist' : 'Join Game')"></button>

                        <button x-show="isInGame && !isHost" class="btn btn-danger btn-full" :disabled="submitting"
                            @click="leaveGame()" x-text="submitting ? 'Leaving...' : 'Leave Game'"></button>

                        <div x-show="isHost" class="pill pill-blue btn-full" style="justify-content:center;">
                            You are the host
                        </div>

                        <p class="error-msg" x-show="error" x-text="error"></p>
                        <p class="success-msg" x-show="success" x-text="success"></p>
                    </div>

                </div>
            </div>

            <div class="players-section">
                <h2>Who's Playing</h2>
                <div class="players-grid">
                    <template x-for="player in game.players" :key="player.id">
                        <div class="player-item">
                            <div class="player-avatar" :class="{ host: player.role === 'host' }"
                                x-text="getPlayerInitials(player)"
                                :aria-label="player.username + (player.role === 'host' ? ' (host)' : '')"></div>
                            <div class="player-name" x-text="player.username"></div>
                            <div class="player-role-badge" x-show="player.role === 'host'">Host</div>
                            <div class="player-role-badge" x-show="player.role === 'waitlist'">Waitlist</div>
                        </div>
                    </template>
                </div>
            </div>

        </div>

        <div x-show="!loading && !game" class="loading-state">
            <p>Game not found.</p>
            <a href="/pages/map.html" class="btn btn-primary" style="margin-top:16px;">Back to map</a>
        </div>

    </div>

    <script src="//unpkg.com/alpinejs" defer></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/game.js"></script>
</body>

</html>
